services:
  cosyvoice-openai:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cosyvoice:openai-latest
    container_name: cosyvoice-openai
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - MODEL_DIR=${MODEL_DIR:-/mnt/e/data/hf_models/hub/models--FunAudioLLM--Fun-CosyVoice3-0.5B-2512/snapshots/07018dea66cd8e62c48ede5294d1bd8850cb0cad}
      - VOICE_DIR=${VOICE_DIR:-/workspace/voices}
      - PORT=${PORT:-8000}
      - HOST=${HOST:-0.0.0.0}
      - DEVICE=${DEVICE:-0}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-${DEVICE:-0}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_IDS:-all}"]
              capabilities: [gpu]
    volumes:
      # Mount local HF cache so model_dir exists in container
      - /mnt/e/data/hf_models/hub:/mnt/e/data/hf_models/hub:ro
      # Mount local voice samples directory
      - ${HOST_VOICE_DIR:-/mnt/e/OneDrive/data_sync/audio_samples}:/workspace/voices:ro
      # Mount source code for development (no need to rebuild on code changes)
      - ./cosyvoice:/workspace/CosyVoice/cosyvoice
      - ./runtime:/workspace/CosyVoice/runtime
      - ./third_party:/workspace/CosyVoice/third_party
      - ./webui.py:/workspace/CosyVoice/webui.py
      - ./example.py:/workspace/CosyVoice/example.py
      - ./vllm_example.py:/workspace/CosyVoice/vllm_example.py
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 223.5.5.5
      - 10.255.255.254
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
